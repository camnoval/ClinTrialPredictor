[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trial-pos"
version = "0.0.1"
description = "Reproduce & beat the 2019 Novartis PoS approach on public 2024 clinical-trial data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",   # ridge aggregation (glmnet -> sklearn)
  "xgboost>=2.0",        # trial-level boosted models
  "pyyaml>=6.0",         # config registry
]

[project.optional-dependencies]
bayes = ["pymc>=5.0", "bambi>=0.13"]   # Bayesian logistic (rstanarm -> pymc/bambi)
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
